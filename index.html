    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Nexora: Compare smarter, choose better. Futuristic electronics comparison platform for smartphones, laptops, tablets, headphones, smartwatches, and monitors." />

    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nexora_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
